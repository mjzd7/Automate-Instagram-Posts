<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Flow - Automated Instagram Quote Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:32px; font-family:'Instrument Serif',serif; background:#ffffff; }
  .eyebrow { font-family:'Geist Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:#4f5d75; margin-bottom:8px; }
  h1 { font-family:'Instrument Serif',serif; font-size:28px; font-weight:400; margin:0 0 16px; color:#2d3142; }
  svg { width:100%; max-width:1000px; height:auto; display:block; margin:0 auto; }
  .paper { fill:#f5f5f5; }
  .ink { fill:#2d3142; stroke:#2d3142; }
  .muted { fill:#4f5d75; stroke:#4f5d75; }
  .soft { fill:#7a8399; stroke:#7a8399; }
  .accent { fill:#eb6c36; stroke:#eb6c36; }
  .accent-tint { fill:#eb6c36; fill-opacity:0.10; stroke:#eb6c36; }
  .link { fill:#2e5aa8; stroke:#2e5aa8; }
  .node-stroke { stroke-width:1; }
  .rule-hair { stroke:rgba(45,49,66,0.10); stroke-width:0.8; }
  .legend-dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
  .legend-dot-step { background:#eb6c36; }
  .legend-dot-db { background:#4f5d75; }
  .legend-dot-ext { background:#2e5aa8; }
  .legend-dot-action { background:#7a8399; }
</style>
</head>
<body>
<div class="eyebrow">DATA FLOW</div>
<h1>Quote-to-Post Pipeline</h1>

<svg role="img" aria-labelledby="data-title data-desc" viewBox="0 0 900 500">
<title id="data-title">Data Flow - Quote-to-Post Pipeline</title>
<desc id="data-desc">Sequence diagram showing the end-to-end flow from scheduler triggering through quote selection, background sourcing, content filtering, image composition, publishing, and storage.</desc>

<!-- Background -->
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- Markers -->
<defs>
  <marker id="data-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
  </marker>
  <marker id="data-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
  </marker>
  <marker id="data-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
  </marker>
  
  <!-- Activation bars -->
  <style>
    .activation { fill:#f5f5f5; }
  </style>
</defs>

<!-- Lifelines -->
<g transform="translate(80,0)">
  <!-- Scheduler/CLI -->
  <text x="0" y="40" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Scheduler/CLI</text>
  <line x1="0" y1="60" x2="0" y2="420" stroke="#2d3142" stroke-width="1"/>
  
  <!-- Quote Provider -->
  <text x="140" y="40" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Quote Provider</text>
  <line x1="140" y1="60" x2="140" y2="420" stroke="#2d3142" stroke-width="1"/>
  
  <!-- Background Provider -->
  <text x="260" y="40" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Background Provider</text>
  <line x1="260" y1="60" x2="260" y2="420" stroke="#2d3142" stroke-width="1"/>
  
  <!-- Content Filter -->
  <text x="380" y="40" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Content Filter</text>
  <line x1="380" y1="60" x2="380" y2="420" stroke="#2d3142" stroke-width="1"/>
  
  <!-- Compositor -->
  <text x="500" y="40" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Compositor</text>
  <line x1="500" y1="60" x2="500" y2="420" stroke="#2d3142" stroke-width="1"/>
  
  <!-- Hashtag Selector -->
  <text x="620" y="40" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Hashtag Selector</text>
  <line x1="620" y1="60" x2="620" y2="420" stroke="#2d3142" stroke-width="1"/>
  
  <!-- Publisher -->
  <text x="740" y="40" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Publisher</text>
  <line x1="740" y1="60" x2="740" y2="420" stroke="#2d3142" stroke-width="1"/>
  
  <!-- Instagram API -->
  <text x="860" y="40" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Instagram API</text>
  <line x1="860" y1="60" x2="860" y2="420" stroke="#2d3142" stroke-width="1"/>
  
  <!-- GitHub CDN -->
  <text x="90" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">GitHub CDN</text>
  <line x1="90" y1="470" x2="90" y2="480" stroke="#2e5aa8" stroke-width="1"/>
</g>

<!-- Activation Bars -->
<!-- Scheduler active during initial request -->
<rect x="-20" y="70" width="160" height="20" fill="#f5f5f5" rx="2"/>

<!-- Quote Provider active during quote fetch -->
<rect x="120" y="85" width="160" height="20" fill="#f5f5f5" rx="2"/>
<rect x="120" y="150" width="160" height="20" fill="#f5f5f5" rx="2"/>

<!-- Background Provider active during background fetch -->
<rect x="240" y="110" width="160" height="40" fill="#f5f5f5" rx="2"/>

<!-- Content Filter active during filtering -->
<rect x="360" y="185" width="160" height="20" fill="#f5f5f5" rx="2"/>

<!-- Compositor active during composition -->
<rect x="480" y="220" width="160" height="20" fill="#f5f5f5" rx="2"/>

<!-- Hashtag Selector active during selection -->
<rect x="600" y="265" width="160" height="20" fill="#f5f5f5" rx="2"/>

<!-- Publisher active during publishing -->
<rect x="720" y="310" width="160" height="20" fill="#f5f5f5" rx="2"/>

<!-- Instagram API active during media ops -->
<rect x="840" y="340" width="160" height="40" fill="#f5f5f5" rx="2"/>

<!-- GitHub active during image serving -->
<rect x="70" y="410" width="160" height="20" fill="#f5f5f5" rx="2"/>

<!-- Messages -->
<!-- Scheduler -> Quote Provider: Request quote -->
<line x1="0" y1="100" x2="140" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="70" y="92" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Request quote (with fallbacks)</text>

<!-- Quote Provider -> Scheduler: Return quote -->
<line x1="140" y1="130" x2="0" y2="130" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)" stroke-dasharray="4,3"/>
<text x="70" y="122" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Return quote + author</text>

<!-- Scheduler -> Background Provider: Fetch backgrounds -->
<line x1="0" y1="160" x2="260" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="130" y="152" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Fetch candidate backgrounds</text>

<!-- Background Provider loop: Query APIs -->
<line x1="260" y1="180" x2="260" y2="210" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="275" y="195" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Query Pexels/Unsplash/Pixabay</text>

<!-- Background Provider -> Scheduler: Return candidates -->
<line x1="260" y1="220" x2="0" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)" stroke-dasharray="4,3"/>
<text x="130" y="212" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Return background candidates</text>

<!-- Scheduler -> Content Filter: Check safety -->
<line x1="0" y1="280" x2="380" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="190" y="272" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Check content safety</text>

<!-- Content Filter loop: Google Vision -->
<line x1="380" y1="300" x2="380" y2="330" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="395" y="315" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">SafeSearch + Labels + OCR</text>

<!-- Content Filter -> Scheduler: Pass/Fail -->
<line x1="380" y1="340" x2="0" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)" stroke-dasharray="4,3"/>
<text x="190" y="332" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Pass/Fail with reason</text>

<!-- Scheduler -> Compositor: Compose image -->
<line x1="0" y1="400" x2="500" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="250" y="392" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Compose image (9-step pipeline)</text>

<!-- Compositor internal steps -->
<line x1="500" y1="420" x2="500" y2="450" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="515" y="435" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Resize, vignette, grain, text, glass card, shadow</text>

<!-- Compositor -> Scheduler: Return JPEG -->
<line x1="500" y1="460" x2="0" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)" stroke-dasharray="4,3"/>
<text x="250" y="452" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Return composed JPEG</text>

<!-- Scheduler -> GitHub CDN: Upload image -->
<line x1="0" y1="480" x2="90" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="45" y="472" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Upload composed image</text>

<!-- GitHub CDN -> Scheduler: Return URL -->
<line x1="90" y1="490" x2="0" y2="490" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)" stroke-dasharray="4,3"/>
<text x="45" y="482" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Return public URL</text>

<!-- Scheduler -> Hashtag Selector: Select hashtags -->
<line x1="0" y1="380" x2="620" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="310" y="372" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Select hashtags</text>

<!-- Hashtag Selector internal: Combine tags -->
<line x1="620" y1="400" x2="620" y2="430" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="635" y="415" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">1 fixed + 3 trending + 1 category</text>

<!-- Hashtag Selector -> Scheduler: Return tags -->
<line x1="620" y1="440" x2="0" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)" stroke-dasharray="4,3"/>
<text x="310" y="432" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Return hashtag list</text>

<!-- Scheduler -> Publisher: Publish to Instagram -->
<line x1="0" y1="300" x2="740" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="370" y="292" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Publish to Instagram</text>

<!-- Publisher -> Instagram API: Create media -->
<line x1="740" y1="330" x2="860" y2="330" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="800" y="322" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Create media object</text>

<!-- Publisher -> Instagram API: Publish media -->
<line x1="740" y1="360" x2="860" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="800" y="352" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Publish media</text>

<!-- Instagram API -> Publisher: Return post ID -->
<line x1="860" y1="380" x2="740" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)" stroke-dasharray="4,3"/>
<text x="800" y="372" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Return post ID</text>

<!-- Publisher -> Scheduler: Success -->
<line x1="740" y1="400" x2="0" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)" stroke-dasharray="4,3"/>
<text x="370" y="392" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Success with post ID</text>

<!-- Scheduler -> Scheduler: Save record -->
<line x1="0" y1="320" x2="0" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="10" y="340" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Save post record to DB</text>

<!-- Scheduler -> Scheduler: Git commit -->
<line x1="0" y1="370" x2="0" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="10" y="385" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Git commit composed image</text>

<!-- Retry on failure -->
<line x1="0" y1="300" x2="0" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#data-arrow)"/>
<text x="10" y="320" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Retry with next candidate</text>

<!-- Alt: Background fails -->
<path d="M 0 240 Q 100 160 260 180" fill="none" stroke="#cccccc" stroke-width="0.5" stroke-dasharray="2,2"/>
<text x="80" y="210" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">alt Background fails filter</text>

</svg>
</body>
</html>
