<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" aria-labelledby="pub-title pub-desc" viewBox="0 0 800 350">
<title id="pub-title">Publishing & API Integration</title>
<desc id="pub-desc">Flowchart showing the Instagram publishing workflow from post generation through rate limiting, media creation, publishing, and storage.</desc>

<!-- Background -->
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- Markers -->
<defs>
  <marker id="pub-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
  </marker>
  <marker id="pub-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
  </marker>
</defs>

<!-- Generate Post -->
<rect x="40" y="40" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="120" y="60" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Generate Post</text>

<!-- Check Rate Cap -->
<rect x="40" y="100" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="120" y="120" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Check Rate Cap</text>
<text x="120" y="135" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">rhombus - decision</text>

<!-- Skip Post (Rate Cap) -->
<rect x="40" y="160" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="120" y="180" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Skip Post</text>
<text x="120" y="195" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Exceeded</text>

<!-- Check Posting Hour -->
<rect x="240" y="100" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="320" y="120" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Check Posting Hour</text>
<text x="320" y="135" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">rhombus - decision</text>

<!-- Skip Post (Hour) -->
<rect x="240" y="160" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="320" y="180" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Skip Post</text>
<text x="320" y="195" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Not Window</text>

<!-- Create Media Object -->
<rect x="440" y="100" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="520" y="120" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Create Media Object</text>

<!-- Upload Image -->
<rect x="440" y="160" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-weight="1"/>
<text x="520" y="180" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Upload Image</text>

<!-- Publish to Instagram -->
<rect x="440" y="220" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-weight="1"/>
<text x="520" y="240" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Publish to Instagram</text>

<!-- Success? -->
<rect x="440" y="280" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="520" y="300" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Success?</text>
<text x="520" y="315" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">rhombus - decision</text>

<!-- Save Post Record -->
<rect x="440" y="340" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="520" y="360" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Save Post Record</text>

<!-- Retry with Backoff -->
<rect x="440" y="400" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="520" y="420" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Retry with Backoff</text>

<!-- Mark Failed + Notify -->
<rect x="640" y="100" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="720" y="120" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Mark Failed + Notify</text>

<!-- Git Commit Image -->
<rect x="640" y="160" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-weight="1"/>
<text x="720" y="180" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Git Commit Image</text>

<!-- Send Discord Notification -->
<rect x="640" y="220" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-weight="1"/>
<text x="720" y="240" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Send Discord Notification</text>

<!-- Arrows -->
<path d="M 120 80 L 120 100" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pub-arrow)"/>
<path d="M 120 140 L 120 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pub-arrow)"/>
<path d="M 320 140 L 320 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pub-arrow)"/>
<path d="M 520 140 L 520 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pub-arrow)"/>
<path d="M 520 200 L 520 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pub-arrow)"/>
<path d="M 520 260 L 520 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pub-arrow)"/>
<path d="M 520 300 L 520 340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pub-arrow)"/>
<path d="M 520 380 L 520 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pub-arrow)"/>

<!-- Success path -->
<path d="M 520 300 L 640 100" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pub-arrow)"/>
<text x="530" y="200" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Yes</text>

<!-- Retry path -->
<path d="M 520 320 L 520 340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pub-arrow)"/>
<path d="M 520 360 L 520 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pub-arrow)"/>
<text x="530" y="350" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">No</text>

<!-- Error path -->
<path d="M 520 340 L 640 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pub-arrow)"/>
<text x="580" y="280" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Max Retries</text>

<!-- Skip paths -->
<path d="M 120 160 L 120 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pub-arrow)"/>
<path d="M 320 160 L 320 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pub-arrow)"/>
<text x="130" y="180" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Exceeded</text>
<text x="330" y="180" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Not Window</text>

<!-- Media flow -->
<path d="M 600 120 L 640 120" fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#pub-arrow-link)"/>
<text x="610" y="112" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Upload</text>

<path d="M 600 180 L 640 180" fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#pub-arrow-link)"/>
<text x="610" y="172" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Publish</text>

<path d="M 600 240 L 640 240" fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#pub-arrow-link)"/>
<text x="610" y="232" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Notify</text>

<path d="M 600 300 L 640 300" fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#pub-arrow-link)"/>
<text x="610" y="292" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Commit</text>

<!-- Focal elements -->
<rect x="230" y="80" width="160" height="40" rx="6" fill="#eb6c36" fill-opacity="0.10" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="234" y="84" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="284" y="94" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">FOCAL</text>
<text x="284" y="104" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Rate Limiting</text>
<text x="284" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">& Posting Hours</text>

<rect x="430" y="280" width="160" height="40" rx="6" fill="#eb6c36" fill-opacity="0.10" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="434" y="284" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="484" y="294" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">FOCAL</text>
<text x="484" y="304" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Success Handling</text>
<text x="484" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">save & notify</text>

<!-- Legend -->
<line x1="40" y1="340" x2="760" y2="340" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="360" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<text x="120" y="360" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">  <span class="legend-dot" style="background:#eb6c36;"></span> Decision Points | <span class="legend-dot" style="background:#2e5aa8;"></span> Media Flow</text>
</svg>
