<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background & Asset Management - Automated Instagram Quote Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:32px; font-family:'Instrument Serif',serif; background:#ffffff; }
  .eyebrow { font-family:'Geist Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:#4f5d75; margin-bottom:8px; }
  h1 { font-family:'Instrument Serif',serif; font-size:28px; font-weight:400; margin:0 0 16px; color:#2d3142; }
  svg { width:100%; max-width:800px; height:auto; display:block; margin:0 auto; }
</style>
</head>
<body>
<div class="eyebrow">BACKGROUND & ASSET MANAGEMENT</div>
<h1>Image Sourcing & Filtering Pipeline</h1>

<svg role="img" aria-labelledby="bg-title bg-desc" viewBox="0 0 800 350">
<title id="bg-title">Background & Asset Management</title>
<desc id="bg-desc">Flowchart showing the background sourcing and filtering pipeline from request through API fetching, safety filtering, suitability scoring, and storage.</desc>

<!-- Background -->
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- Markers -->
<defs>
  <marker id="bg-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
  </marker>
  <marker id="bg-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
  </marker>
</defs>

<!-- Request Background -->
<rect x="40" y="40" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="120" y="60" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Request Background</text>

<!-- Check DB Cache -->
<rect x="40" y="100" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="120" y="120" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Check DB Cache</text>
<text x="120" y="135" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">rhombus - decision</text>

<!-- Return Cached Background -->
<rect x="40" y="160" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="120" y="180" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Return Cached Background</text>

<!-- Fetch from APIs -->
<rect x="240" y="100" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="320" y="120" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Fetch from APIs</text>

<!-- API sources -->
<rect x="440" y="100" width="100" height="30" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="490" y="115" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Pexels</text>
<rect x="440" y="140" width="100" height="30" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="490" y="155" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Unsplash</text>
<rect x="440" y="180" width="100" height="30" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="490" y="195" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Pixabay</text>

<!-- Apply Safety Filter -->
<rect x="240" y="160" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="320" y="180" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Apply Safety Filter</text>

<!-- Score Suitability -->
<rect x="240" y="220" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="320" y="240" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Score Suitability</text>

<!-- Store in DB -->
<rect x="240" y="280" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="320" y="300" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Store in DB</text>

<!-- Return Best Match -->
<rect x="240" y="340" width="160" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="320" y="360" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Return Best Match</text>

<!-- Arrows -->
<path d="M 120 80 L 120 100" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bg-arrow)"/>
<path d="M 120 140 L 120 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bg-arrow)"/>
<path d="M 200 120 L 240 120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bg-arrow)"/>
<path d="M 200 160 L 240 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bg-arrow)"/>
<path d="M 200 220 L 240 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bg-arrow)"/>
<path d="M 200 280 L 240 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bg-arrow)"/>
<path d="M 200 340 L 240 340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bg-arrow)"/>

<!-- API connections -->
<path d="M 320 120 L 440 115" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#bg-arrow)"/>
<path d="M 320 120 L 440 155" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#bg-arrow)"/>
<path d="M 320 120 L 440 195" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#bg-arrow)"/>

<!-- Safety filter processing -->
<path d="M 400 130 L 400 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bg-arrow)"/>

<!-- Suitability scoring -->
<path d="M 400 200 L 400 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bg-arrow)"/>

<!-- Focal elements -->
<rect x="310" y="100" width="160" height="40" rx="6" fill="#eb6c36" fill-opacity="0.10" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="314" y="104" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="364" y="114" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">FOCAL</text>
<text x="364" y="124" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Safety Filter</text>
<text x="364" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">safety & quality</text>

<rect x="310" y="220" width="160" height="40" rx="6" fill="#eb6c36" fill-opacity="0.10" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="314" y="224" width="100" height="12" rx="2" fill="#ffffff"/>
<text x="364" y="234" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">FOCAL</text>
<text x="364" y="244" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Scoring</text>
<text x="364" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">suitability</text>

<!-- Legend -->
<line x1="40" y1="300" x2="760" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<text x="120" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">  <span class="legend-dot" style="background:#eb6c36;"></span> Processing Steps | <span class="legend-dot" style="background:#2e5aa8;"></span> API Sources</text>
</svg>
</body>
</html>
