name: Refresh Curated Quote Pool (38-Day Cycle)

on:
  schedule:
    # Runs automatically on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  refresh-quotes:
    concurrency:
      group: db-lock
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quote pool refresh & 38-day reset
        run: pnpm refresh-quotes

      - name: Commit and push refreshed database & seed state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(quotes): automated 38-day quote pool refresh" && git push)
